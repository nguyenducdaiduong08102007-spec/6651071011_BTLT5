<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style type="text/css">
        body { margin: 30px; }
    </style>
    <title>Count and display items of a dropdown list w3resource</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body> 
    <form>
        Select your favorite Color :
        <select id="mySelect">
            <option>Red</option>
            <option>Green</option>
            <option>Blue</option>
            <option>White</option>
        </select>
        <input type="button" onclick="getOptions()" value="Count and Output all items">
    </form>

    <script>
        function getOptions() {
            var options = $('#mySelect option');
            var count = options.length;
            var message = "Số lượng mục: " + count + "\nDanh sách các mục:\n";
            
            options.each(function(index, el) {
                message += (index + 1) + ". " + $(el).text() + "\n";
            });
            
            alert(message);
        }
    </script>
</body>
</html>
