<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Insert row in a table w3resource</title>
</head>
<body>
    <table id="sampleTable" border="1">
        <tr><td>Row1 cell1</td><td>Row1 cell2</td></tr>
        <tr><td>Row2 cell1</td><td>Row2 cell2</td></tr>
    </table><br>
    <input type="button" onclick="insert_Row()" value="Insert row"> 

    <script>
        function insert_Row() {
            var table = document.getElementById('sampleTable');
            // Lấy tổng số hàng hiện tại để tính chỉ số dòng mới
            var rowCount = table.rows.length;
            
            // Thêm dòng mới ở cuối bảng
            var newRow = table.insertRow(rowCount);
            
            // Tạo 2 ô trong dòng mới
            var cell1 = newRow.insertCell(0);
            var cell2 = newRow.insertCell(1);
            
            // Gán nội dung cho 2 ô
            cell1.innerHTML = "Row" + (rowCount + 1) + " cell1";
            cell2.innerHTML = "Row" + (rowCount + 1) + " cell2";
        }
    </script>
</body>
</html>
