<!DOCTYPE html> 
<html> 
<head> 
    <style type="text/css"> 
        body {margin: 30px;} 
    </style> 
    <meta charset="utf-8" /> 
    <title>Remove items from a dropdown list</title> 
</head>
<body>
    <form> 
        <select id="colorSelect"> 
            <option>Red</option> 
            <option>Green</option> 
            <option>White</option> 
            <option>Black</option> 
        </select> 
        <input type="button" onclick="removecolor()" value="Select and Remove"> 
    </form>

    <script>
        function removecolor() {
            var selectBox = document.getElementById('colorSelect');
            // Kiểm tra xem có mục nào đang được chọn không
            if (selectBox.selectedIndex !== -1) {
                // Xóa mục tại vị trí được chọn
                selectBox.remove(selectBox.selectedIndex);
            }
        }
    </script>
</body>
</html>
